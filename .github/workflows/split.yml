# 対局記録のCSV(monoqlo-data の YYYYMM.csv)から、まだ入っていない対局を10対局ずつの分割CSVにして足す。
# チーム戦(event-data)は、スケジュールと付き合わせて、対局がそろった開催日の分を1ファイルにして足す。
# - monoqlo-data・event-data にCSVがアップロードされると、そちらのワークフローがこれを呼ぶ(repository_dispatch)。
# - 呼び出しが届かなかったときのために、1日1回も自分で確かめる。
# - 「Actions」タブから手動でも実行できる。
# 分割のきまりは tools/split-new.py の冒頭を参照。
name: 分割CSVを足す

on:
  repository_dispatch:
    types: [monoqlo-data-updated, event-data-updated]
  schedule:
    - cron: "17 19 * * *" # 毎日 4:17(日本時間)
    - cron: "3 17 27-30 * *" # 28〜31日の 2:03(日本時間)。月の最終日なら、その月の端数も出す
  workflow_dispatch:

concurrency:
  group: split
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
      - name: 対局記録を取ってくる
        uses: actions/checkout@v4
        with:
          repository: monoqlo-league/monoqlo-data
          path: _data
      - name: チーム戦の対局記録を取ってくる(チーム戦の対局を分割に入れないため)
        uses: actions/checkout@v4
        with:
          repository: monoqlo-league/event-data
          path: _event
      - name: 分割する
        id: split
        env:
          SPLIT_FLUSH: ${{ github.event.schedule == '3 17 27-30 * *' && '1' || '' }}
        run: python3 tools/split-new.py _data _event
      - name: チーム戦を開催日ごとに分ける
        id: event
        run: python3 tools/split-event.py _event
      - name: 保存して公開する
        if: steps.split.outputs.made != '0' || steps.event.outputs.made_event != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node tools/build-manifest.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '[0-9][0-9][0-9][0-9][0-9][0-9]/*.csv' event files.json
          git commit -q -m "分割CSVを追加(自動。個人戦 ${{ steps.split.outputs.made }}・チーム戦 ${{ steps.event.outputs.made_event }})"
          ok=
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || exit 1
          # 念のため、公開ページの作り直しも頼む(失敗しても止めない)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" >/dev/null || echo "ページの作り直しの依頼は通らなかった(自動で作り直されていれば問題ない)"
